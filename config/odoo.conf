[options]
; Database connection (inside Docker network)
db_host = db
db_port = 5432
db_user = odoo
db_password = 410554
db_name = odoo_test

; Addons paths (mounted volumes)
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Database filtering
dbfilter = ^odoo_test$
list_db = False

; HTTP service
http_port = 8069
http_interface = 0.0.0.0

; Logging
logfile = /var/log/odoo/odoo.log
log_level = info


